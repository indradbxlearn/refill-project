schema: silver_flowstream
source_schema: bronze_flowstream

tables:
  # -------------------------------------------------------------------
  # orders_clean — partitioned by order_date for time-range query pruning
  # Liquid Clustering on (customer_id, order_date) for flexible analytics
  # -------------------------------------------------------------------
  - name: orders_clean
    source_table: orders_raw
    cdc:
      enabled: true
      keys:
        - order_id
      sequence_by: event_timestamp
      stored_as_scd_type: 1
    liquid_clustering:
      enabled: true
      cluster_by:
        - customer_id
        - order_date
    expectations:
      - name: valid_order_id
        constraint: "order_id IS NOT NULL"
        action: drop
      - name: valid_amount
        constraint: "order_amount >= 0"
        action: warn
    columns:
      order_id: string
      customer_id: string
      product_id: string
      order_amount: double
      order_status: string
      order_date: date
      event_timestamp: timestamp
      country_code: string

  # -------------------------------------------------------------------
  # order_events_clean — the CDC source table
  # Tracks every state transition per order
  # -------------------------------------------------------------------
  - name: order_events_clean
    source_table: order_events_raw
    cdc:
      enabled: false
    liquid_clustering:
      enabled: false
    expectations:
      - name: valid_event
        constraint: "order_id IS NOT NULL AND event_type IS NOT NULL"
        action: drop
    columns:
      order_id: string
      event_type: string
      previous_status: string
      new_status: string
      event_timestamp: timestamp
      updated_by: string

  # -------------------------------------------------------------------
  # products_clean — Z-ordering on product_id + category for filter queries
  # -------------------------------------------------------------------
  - name: products_clean
    source_table: products_raw
    cdc:
      enabled: true
      keys:
        - product_id
      sequence_by: updated_at
      stored_as_scd_type: 1
    liquid_clustering:
      enabled: false
    z_order:
      enabled: true
      columns:
        - product_id
        - category
    expectations:
      - name: valid_product_id
        constraint: "product_id IS NOT NULL"
        action: drop
    columns:
      product_id: string
      product_name: string
      category: string
      unit_price: double
      stock_quantity: int
      updated_at: timestamp

  # -------------------------------------------------------------------
  # customers_clean — partitioned by country_code
  # -------------------------------------------------------------------
  - name: customers_clean
    source_table: customers_raw
    cdc:
      enabled: true
      keys:
        - customer_id
      sequence_by: updated_at
      stored_as_scd_type: 1
    liquid_clustering:
      enabled: false
    partition_by: country_code
    expectations:
      - name: valid_customer_id
        constraint: "customer_id IS NOT NULL"
        action: drop
      - name: valid_country
        constraint: "country_code IS NOT NULL"
        action: warn
    columns:
      customer_id: string
      customer_name: string
      email: string
      country_code: string
      segment: string
      registered_at: timestamp
      updated_at: timestamp