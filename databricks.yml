bundle:
  name: refill_project

# UPDATED: We now point to the sub-folders inside resources
include:
  - resources/pipelines/*.yml
  - resources/jobs/*.yml

variables:
  catalog_name:
    description: The catalog to deploy to
    default: bi_dev
  env:
    description: The environment name
    default: dev

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-0d473c91-2622.cloud.databricks.com
    variables:
      catalog_name: bi_dev
      env: dev

  qa:
    workspace:
      host: https://dbc-0d473c91-2622.cloud.databricks.com
    variables:
      catalog_name: bi_qa
      env: qa

  prod:
    workspace:
      host: https://dbc-0d473c91-2622.cloud.databricks.com
    variables:
      catalog_name: bi_prod
      env: prod